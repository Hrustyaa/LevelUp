name: levelup_test
description: LevelUp proof of concept for a user-controlled Android screen-time gate.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  shared_preferences: ^2.5.6
  flutter:
    sdk: flutter
  camera: ^0.12.2
  camera_android: ^0.10.13
  google_mlkit_pose_detection: ^1.0.3
  material_ui: ^1.11.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/levelup_mark.png

flutter_launcher_icons:
  android: true
  image_path: assets/images/app_icon.png
  min_sdk_android: 24
  adaptive_icon_background: "#26282B"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  adaptive_icon_foreground_inset: 14
